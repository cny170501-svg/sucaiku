<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工装方案素材库</title>
<style>
  :root{
    --ink:#1c1c1e; --sub:#6e6e73; --line:#e6e3dc; --bg:#f7f5f1;
    --gold:#a8802f; --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:inherit;text-decoration:none}

  /* ---------- 顶栏 ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(247,245,241,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:2px}
  .brand .en{font-size:11px;color:var(--gold);letter-spacing:3px;text-transform:uppercase}
  .searchbox{flex:1;min-width:220px;max-width:520px;position:relative}
  .searchbox input{width:100%;padding:10px 16px 10px 38px;border:1px solid var(--line);border-radius:999px;
    background:#fff;font-size:14px;outline:none;transition:.2s}
  .searchbox input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,128,47,.12)}
  .searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--sub)}
  .count{font-size:12.5px;color:var(--sub);white-space:nowrap}

  /* ---------- 主体 ---------- */
  .layout{display:flex;gap:22px;padding:22px;align-items:flex-start;max-width:1560px;margin:0 auto}
  aside{width:200px;flex-shrink:0;position:sticky;top:78px}
  aside .allbtn{display:block;width:100%;text-align:left;padding:9px 12px;border:none;background:none;
    font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;border-radius:8px}
  aside .allbtn:hover{background:#eee9e0}
  aside .allbtn.on{background:var(--ink);color:#fff}
  .catgroup{margin-top:14px}
  .catname{font-size:13px;font-weight:700;padding:6px 12px;color:var(--ink);display:flex;align-items:center;gap:8px}
  .catname::before{content:"";width:8px;height:8px;background:var(--gold);border-radius:2px;flex-shrink:0}
  .stylebtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
    padding:7px 12px 7px 24px;border:none;background:none;font-size:13px;color:var(--sub);cursor:pointer;border-radius:8px}
  .stylebtn:hover{background:#eee9e0;color:var(--ink)}
  .stylebtn.on{background:#f0e7d4;color:var(--gold);font-weight:600}
  .stylebtn .num{font-size:11px;opacity:.7}

  main{flex:1;min-width:0}
  .crumb{font-size:13px;color:var(--sub);margin-bottom:14px}
  .crumb b{color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
    transition:transform .18s,box-shadow .18s}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(28,28,30,.12)}
  .thumb{aspect-ratio:4/3;background:#eceae5;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .card:hover .thumb img{transform:scale(1.04)}
  .meta{padding:10px 12px 12px}
  .meta .t{font-size:13.5px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta .c{margin-top:6px;font-size:11.5px;color:var(--gold);letter-spacing:.5px}
  .empty{padding:70px 0;text-align:center;color:var(--sub);font-size:14px;grid-column:1/-1}

  /* ---------- 灯箱 ---------- */
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(16,15,13,.93);display:none;flex-direction:column}
  .lightbox.show{display:flex}
  .lb-top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#d8d4cc}
  .lb-top .info{font-size:13.5px}
  .lb-top .info b{color:#fff;font-size:15px}
  .lb-actions{display:flex;gap:10px;align-items:center}
  .btn{padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;
    font-size:13px;cursor:pointer;transition:.2s}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.gold{background:var(--gold);border-color:var(--gold);font-weight:600}
  .btn.gold:hover{background:#b8933f}
  .lb-body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 64px;position:relative}
  .lb-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-size:20px;cursor:pointer}
  .nav:hover{background:rgba(255,255,255,.18)}
  .nav.prev{left:12px}.nav.next{right:12px}
  .lb-bottom{padding:12px 20px 18px;text-align:center;color:#a49f95;font-size:12.5px}

  /* ---------- 手机 ---------- */
  .mobilecats{display:none;padding:0 16px 10px;gap:8px;overflow-x:auto}
  .mchip{white-space:nowrap;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);
    font-size:13px;cursor:pointer;color:var(--sub)}
  .mchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  @media (max-width:820px){
    .layout{padding:14px}
    aside{display:none}
    .mobilecats{display:flex}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .meta .t{font-size:12.5px}
    .lb-body{padding:0 10px}
    .nav{width:36px;height:36px}
    .nav.prev{left:4px}.nav.next{right:4px}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>工装方案素材库</h1><span class="en">Interior Reference</span></div>
  <div class="searchbox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜风格 / 品类 / 关键词，如：金属、多巴胺、中古、吧台…">
  </div>
  <div class="count" id="count"></div>
</header>

<div class="mobilecats" id="mchips"></div>

<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div class="crumb" id="crumb"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <div class="info" id="lbinfo"></div>
    <div class="lb-actions">
      <a class="btn gold" id="dlbtn" download>下载原图</a>
      <button class="btn" id="closebtn">关闭</button>
    </div>
  </div>
  <div class="lb-body">
    <button class="nav prev" id="prevbtn">‹</button>
    <img id="lbimg" alt="">
    <button class="nav next" id="nextbtn">›</button>
  </div>
  <div class="lb-bottom" id="lbbottom"></div>
</div>

<script src="data.js"></script>
<script>
var images = LIB.images;
var state = { cat: "", style: "", q: "", list: [], idx: 0 };

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}

function statsOf(cat, style){
  return images.filter(function(im){
    return (!cat || im.cat===cat) && (!style || im.style===style);
  }).length;
}

function renderSidebar(){
  var h = '<button class="allbtn' + (!state.cat&&!state.style?" on":"") + '" data-cat="" data-style="">全部素材 <span style="float:right;opacity:.6">'+images.length+'</span></button>';
  LIB.cats.forEach(function(c){
    h += '<div class="catgroup"><div class="catname">'+esc(c.name)+'</div>';
    c.styles.forEach(function(s){
      var on = state.cat===c.name && state.style===s ? " on" : "";
      h += '<button class="stylebtn'+on+'" data-cat="'+esc(c.name)+'" data-style="'+esc(s)+'">'+esc(s)+'<span class="num">'+statsOf(c.name,s)+'</span></button>';
    });
    h += '</div>';
  });
  document.getElementById("sidebar").innerHTML = h;

  var chips = '<div class="mchip'+(!state.cat&&!state.style?" on":"")+'" data-cat="" data-style="">全部</div>';
  LIB.cats.forEach(function(c){
    chips += '<div class="mchip'+(state.cat===c.name&&!state.style?" on":"")+'" data-cat="'+esc(c.name)+'" data-style="">'+esc(c.name)+'</div>';
    c.styles.forEach(function(s){
      chips += '<div class="mchip'+(state.cat===c.name&&state.style===s?" on":"")+'" data-cat="'+esc(c.name)+'" data-style="'+esc(s)+'">'+esc(c.name)+'·'+esc(s)+'</div>';
    });
  });
  document.getElementById("mchips").innerHTML = chips;
}

function applyFilter(){
  var q = state.q.trim().toLowerCase();
  state.list = images.filter(function(im){
    if(state.cat && im.cat!==state.cat) return false;
    if(state.style && im.style!==state.style) return false;
    if(q){
      var hay = (im.title+" "+im.cat+" "+im.style+" "+im.tags.join(" ")).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
}

function renderGrid(){
  applyFilter();
  var g = document.getElementById("grid"), h = "";
  if(!state.list.length){
    h = '<div class="empty">没找到相符的素材，换个关键词试试（如：工业风、吧台、多巴胺）</div>';
  } else {
    state.list.forEach(function(im,i){
      var thumb = im.file.replace(/^images\//, "thumbs/").replace(/\.png$/, ".jpg");
      h += '<div class="card" data-i="'+i+'"><div class="thumb"><img loading="lazy" src="'+esc(thumb)+'" data-full="'+esc(im.file)+'" onerror="this.onerror=null;this.src=this.getAttribute(\'data-full\')" alt="'+esc(im.title)+'"></div>'
        + '<div class="meta"><div class="t">'+esc(im.title)+'</div><div class="c">'+esc(im.cat)+' · '+esc(im.style)+'</div></div></div>';
    });
  }
  g.innerHTML = h;

  var where = state.cat ? (state.cat + (state.style ? " / "+state.style : "")) : "全部素材";
  var cond = state.q ? '，搜"'+esc(state.q)+'"' : "";
  document.getElementById("crumb").innerHTML = "当前浏览：<b>"+esc(where)+"</b>"+cond;
  document.getElementById("count").textContent = "共 "+state.list.length+" 张 / 总 "+images.length+" 张";
  renderSidebar();
}

/* ---------- 灯箱 ---------- */
var lb = document.getElementById("lightbox");
function openLb(i){
  state.idx = i;
  var im = state.list[i];
  document.getElementById("lbimg").src = im.file;
  document.getElementById("lbinfo").innerHTML = "<b>"+esc(im.title)+"</b>　"+esc(im.cat)+" · "+esc(im.style);
  document.getElementById("lbbottom").innerHTML = "关键词："+esc(im.tags.join(" / "))+"　｜　图片来源："+esc(im.src)+"　｜　"+(i+1)+" / "+state.list.length+"（键盘 ← → 切换）";
  var dl = document.getElementById("dlbtn");
  dl.href = im.file;
  dl.setAttribute("download", im.file.split("/").pop());
  lb.classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeLb(){ lb.classList.remove("show"); document.body.style.overflow = ""; }
function step(d){
  var n = state.list.length; if(!n) return;
  openLb((state.idx + d + n) % n);
}

/* ---------- 事件 ---------- */
document.getElementById("grid").addEventListener("click", function(e){
  var card = e.target.closest(".card");
  if(card) openLb(parseInt(card.dataset.i,10));
});
document.getElementById("sidebar").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.cat = b.dataset.cat; state.style = b.dataset.style;
  renderGrid(); window.scrollTo({top:0});
});
document.getElementById("mchips").addEventListener("click", function(e){
  var b = e.target.closest(".mchip"); if(!b) return;
  state.cat = b.dataset.cat; state.style = b.dataset.style;
  renderGrid(); window.scrollTo({top:0});
});
var qtimer;
document.getElementById("q").addEventListener("input", function(){
  clearTimeout(qtimer);
  var v = this.value;
  qtimer = setTimeout(function(){ state.q = v; renderGrid(); }, 180);
});
document.getElementById("closebtn").addEventListener("click", closeLb);
document.getElementById("prevbtn").addEventListener("click", function(){ step(-1); });
document.getElementById("nextbtn").addEventListener("click", function(){ step(1); });
lb.addEventListener("click", function(e){ if(e.target===lb || e.target.classList.contains("lb-body")) closeLb(); });
document.addEventListener("keydown", function(e){
  if(!lb.classList.contains("show")) return;
  if(e.key==="Escape") closeLb();
  if(e.key==="ArrowLeft") step(-1);
  if(e.key==="ArrowRight") step(1);
});

renderGrid();
</script>
</body>
</html>
